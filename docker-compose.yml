# SuiViD — production, conteneur unique (API + front statique)
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Les secrets passent par le fichier .env (non commité) ou par
# l'environnement du conteneur (Portainer : « Environment variables »).

services:
  app:
    # Image publiée par GitHub Actions (ghcr). Pour un build local à la
    # place : docker compose up -d --build
    image: ghcr.io/siagutrop/suivid:latest
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      DATA_MODE: ${DATA_MODE:-sqlite}
      AUTH_SECRET: ${AUTH_SECRET:?definir AUTH_SECRET dans .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      USERS_FILE: /data/users.json
      DB_FILE: ${DB_FILE:-/data/suivid.db}
      COACH_EMAIL: ${COACH_EMAIL:-}
      COACH_PASSWORD: ${COACH_PASSWORD:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Base SQLite + comptes + photos + sauvegardes — tout persiste ici.
      - suivid-data:/data
    ports:
      - "${WEB_PORT:-8080}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  suivid-data:
