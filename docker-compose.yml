# SuiViD — production
#   docker compose up -d --build
#   docker compose logs -f
#   docker compose down
#
# Les secrets passent par le fichier .env (non commité) ou par
# l'environnement du conteneur (Portainer : « Environment variables »).

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      DATA_MODE: ${DATA_MODE:-sheets}
      AUTH_SECRET: ${AUTH_SECRET:?definir AUTH_SECRET dans .env}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      USERS_FILE: /data/users.json
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      PORT: 3001
      HOST: 0.0.0.0
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${GOOGLE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${GOOGLE_OAUTH_REFRESH_TOKEN:-}
    volumes:
      # Comptes utilisateurs (JSON) — persistant entre redéploiements.
      - suivid-data:/data
      # Pour utiliser un fichier de clé, ajouter un volume dans
      # docker-compose.override.yml — voir docs/DEPLOIEMENT.md
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [suivid]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [suivid]

volumes:
  suivid-data:

networks:
  suivid:
    driver: bridge
