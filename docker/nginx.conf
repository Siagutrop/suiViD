# SuiViD — frontend statique + proxy /api vers le service api.
# Un reverse proxy HTTPS (Traefik, Caddy, NPM…) doit terminer TLS
# devant ce conteneur — voir docs/DEPLOIEMENT.md.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml font/woff2;
  gzip_min_length 1024;

  # Sécurité
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy strict-origin-when-cross-origin;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

  # API — proxifiée, jamais mise en cache
  location /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Assets fingerprintés — cache long
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Service worker & manifest — pas de cache
  location ~* /(sw\.js|manifest\.webmanifest|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
