# Build + push de l'image tout-en-un vers GHCR à chaque push sur main.
# Image : ghcr.io/siagutrop/suivid:latest (+ tag par SHA de commit).
#
# Prérequis côté GitHub :
#   - le workflow a besoin de « packages: write » (permission ci-dessous).
#   - première publication : le package GHCR hérite des droits du repo ;
#     pour une image publique → Packages → settings → Change visibility.
#
# Mise à jour sur le serveur :
#   docker compose pull && docker compose up -d

name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/siagutrop/suivid

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags (latest + sha)
        id: meta
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:latest"
            echo "${IMAGE_NAME}:sha-${{ github.sha }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE_NAME: ghcr.io/siagutrop/suivid

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
